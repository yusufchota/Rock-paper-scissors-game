<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎮 Rock • Paper • Scissors</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-black bg-opacity-75 border-bottom border-warning sticky-top">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="#">
        <span class="text-warning">RPS</span> Arena
      </a>
      <span class="navbar-text text-light small">
        Built by <span class="text-warning">Mohammed Yusuf</span>
      </span>
    </div>
  </nav>

  <!-- Main -->
  <main class="py-5">
    <div class="container">
      <div class="row g-4 align-items-stretch">

        <!-- Left: Scores & Info -->
        <div class="col-12 col-lg-4">
          <div class="card h-100 glass-card border-0">
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <h5 class="card-title text-warning fw-semibold mb-3">Scoreboard</h5>

                <div class="d-flex justify-content-between mb-3">
                  <div>
                    <p class="text-white mb-1 small">You</p>
                    <h3 id="playerScore" class="text-light fw-bold">0</h3>
                  </div>
                  <div class="text-center flex-grow-1">
                    <p class="text-white mb-1 small">Round</p>
                    <h4 id="roundNumber" class="text-warning fw-semibold mb-0">1</h4>
                    <p class="text-white mb-0 small">First to <span id="maxScoreLabel">5</span> wins</p>
                  </div>
                  <div class="text-end">
                    <p class="text-white mb-1 small">Computer</p>
                    <h3 id="computerScore" class="text-light fw-bold">0</h3>
                  </div>
                </div>

                <hr class="border-secondary border-opacity-25">

                <p class="text-white small mb-1">Game mode</p>
                <div class="btn-group w-100 mb-3" role="group">
                  <button type="button" class="btn btn-sm btn-outline-warning active mode-btn" data-score="5">First to 5</button>
                  <button type="button" class="btn btn-sm btn-outline-warning mode-btn" data-score="3">First to 3</button>
                  <button type="button" class="btn btn-sm btn-outline-warning mode-btn" data-score="1">Single Round</button>
                </div>

                <p class="text-white small mb-1">Status</p>
                <div id="statusBadge" class="badge bg-success bg-opacity-75">In progress</div>
              </div>

              <div class="mt-4">
                <button id="resetBtn" class="btn btn-outline-light w-100">
                  Reset Game
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Right: Game Area -->
        <div class="col-12 col-lg-8">
          <div class="card h-100 glass-card border-0">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title text-warning fw-semibold mb-3">Make your move</h5>

              <!-- Choices -->
              <div class="row g-3 mb-4">
                <div class="col-4">
                  <button class="choice-btn btn btn-outline-light w-100 py-3" data-choice="rock">
                    <div class="fs-1">✊</div>
                    <div class="mt-1 small fw-semibold text-uppercase">Rock</div>
                  </button>
                </div>
                <div class="col-4">
                  <button class="choice-btn btn btn-outline-light w-100 py-3" data-choice="paper">
                    <div class="fs-1">✋</div>
                    <div class="mt-1 small fw-semibold text-uppercase">Paper</div>
                  </button>
                </div>
                <div class="col-4">
                  <button class="choice-btn btn btn-outline-light w-100 py-3" data-choice="scissors">
                    <div class="fs-1">✌️</div>
                    <div class="mt-1 small fw-semibold text-uppercase">Scissors</div>
                  </button>
                </div>
              </div>

              <!-- Results -->
              <div class="result-panel mt-auto">
                <p class="text-white small mb-1">Last round</p>
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
                  <div class="text-center flex-fill">
                    <p class="text-white small mb-1">You played</p>
                    <div id="playerChoice" class="fs-3 text-light">—</div>
                  </div>
                  <div class="text-center flex-fill">
                    <p class="text-white small mb-1">Computer played</p>
                    <div id="computerChoice" class="fs-3 text-light">—</div>
                  </div>
                </div>

                <div class="alert alert-dark bg-gradient border-0 text-center mb-0" id="roundResult">
                  Tap a move to start the game.
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Game Over Modal -->
  <div class="modal fade" id="gameOverModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border border-warning border-opacity-50">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="gameOverTitle">Game Over</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p id="gameOverMessage" class="mb-0"></p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-warning" id="playAgainBtn">Play again</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS + Custom JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
